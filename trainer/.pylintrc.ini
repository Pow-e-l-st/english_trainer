[MASTER]
load-plugins=pylint_django

[MESSAGES CONTROL]
disable=C0114,  # missing module docstring (не требуется для каждого файла)
        C0115,  # missing class docstring (для моделей docstring есть в классах)
        C0116,  # missing function docstring (у нас добавлены)
        R0903,  # too few public methods (для моделей допустимо)
        W0511,  # TODO (не используется)

[FORMAT]
max-line-length=100

[DESIGN]
max-args=6
max-attributes=12