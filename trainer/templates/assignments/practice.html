{% extends 'base.html' %}
{% block title %}Тренировка: {{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card card-custom p-4 text-center">
    <h2>{{ title }}</h2>
    <div class="mb-4"><div class="btn-group"><a href="?direction=en-ru" class="btn btn-outline-secondary {% if direction == 'en-ru' %}active{% endif %}">EN → RU</a><a href="?direction=ru-en" class="btn btn-outline-secondary {% if direction == 'ru-en' %}active{% endif %}">RU → EN</a></div></div>
    <div class="alert alert-info"><h3>{{ prompt }}</h3></div>
    <p>Карточка {{ current }} из {{ total }}</p>
    <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit" class="btn btn-primary w-100">Проверить</button></form>
</div></div></div>
{% endblock %}
