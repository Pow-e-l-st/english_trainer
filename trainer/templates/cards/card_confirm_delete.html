{% extends 'base.html' %}
{% block title %}Удаление карточки{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card card-custom p-4">
    <h2 class="text-center mb-4">Удаление карточки</h2>
    <p>Удалить карточку <strong>{{ card.word }} - {{ card.translation }}</strong>?</p>
    <form method="post">{% csrf_token %}<div class="d-flex justify-content-between"><button type="submit" class="btn btn-danger">Да, удалить</button><a href="{% url 'card_list' %}" class="btn btn-secondary">Отмена</a></div></form>
</div></div></div>
{% endblock %}
