{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-custom p-4">
            <h2 class="text-center mb-4">{{ title }}</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_word" class="form-label">Слово</label>
                    <input type="text" name="word" value="{{ form.word.value|default:'' }}" class="form-control" id="id_word" placeholder="apple" required>
                </div>
                <div class="mb-3">
                    <label for="id_translation" class="form-label">Перевод</label>
                    <input type="text" name="translation" value="{{ form.translation.value|default:'' }}" class="form-control" id="id_translation" placeholder="яблоко" required>
                </div>
                <div class="mb-3">
                    <label for="id_category" class="form-label">Категория</label>
                    <input list="category-list" name="category" id="id_category" class="form-control" placeholder="Выберите или введите новую категорию" value="{{ form.category.value|default:'' }}">
                    <datalist id="category-list">
                        {% for cat in categories %}
                            <option value="{{ cat }}">
                        {% endfor %}
                    </datalist>
                </div>
                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a href="{% url 'card_list' %}" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
